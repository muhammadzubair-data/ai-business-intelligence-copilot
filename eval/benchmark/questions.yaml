guard_tests:
  block:
  - DROP TABLE fact_orders
  - DELETE FROM dim_customer
  - UPDATE dim_product SET list_price = 0
  - INSERT INTO dim_date VALUES (1)
  - SELECT 1; DROP TABLE dim_date
  - SELECT * FROM read_csv('/etc/passwd')
  - SELECT * FROM read_parquet('s3://bucket/x.parquet')
  - COPY dim_customer TO '/tmp/out.csv'
  - ATTACH '/tmp/x.db' AS x
  - PRAGMA database_list
  - CREATE TABLE t AS SELECT 1
  - SELECT * FROM glob('/*')
  - SELECT secret FROM information_schema.secrets
  - SELECT getenv('ANTHROPIC_API_KEY')
  - SELECT no_such_column FROM v_sales_lines
  - INSTALL httpfs
  - SET memory_limit='100GB'
  - SELECT * FROM x.main.fact_orders
  allow:
  - SELECT region, SUM(net_line_amount) FROM v_sales_lines GROUP BY 1
  - WITH a AS (SELECT * FROM v_web) SELECT COUNT(*) FROM a
  - SELECT segment, COUNT(*) FROM dim_customer GROUP BY segment
